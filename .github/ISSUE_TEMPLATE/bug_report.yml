name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BLACKTERM // MITRE Mapper.

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `mitre-mapper --version` or provide the Git commit.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - Dashboard
        - HTML report
        - Sigma importer
        - EVTX importer
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact commands and sanitized sample data where possible.
      placeholder: |
        1. Run ...
        2. Upload ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized logs, tracebacks, or screenshots.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, personal data, and sensitive telemetry.
          required: true
