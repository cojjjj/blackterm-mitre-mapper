- id: BT-T1562-001
  name: Disable Security Tools
  technique_id: T1562.001
  technique_name: Impair Defenses
  tactics: [defense-evasion]
  severity: critical
  confidence: 0.91
  description: Detects commands that disable common security controls or antivirus protections.
  platforms: [Windows, Linux, macOS]
  match:
    any:
      - field: process.command_line
        operator: regex
        value: '(?i)Set-MpPreference.*-DisableRealtimeMonitoring\s+\$?true'
        weight: 2.0
      - field: process.command_line
        operator: regex
        value: '(?i)\bsc(?:\.exe)?\s+(?:stop|config)\s+(?:WinDefend|Sense)\b'
        weight: 2.0
      - field: process.command_line
        operator: regex
        value: '(?i)\bsystemctl\s+(?:stop|disable)\s+(?:auditd|falcon-sensor|wazuh-agent)\b'
        weight: 2.0
  references:
    - https://attack.mitre.org/techniques/T1562/001/

